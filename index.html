  --border:#232327; --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text',Segoe UI,Tahoma,Arial,sans-serif;
  height:100%; overscroll-behavior-y:none;}
body{padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hide{display:none !important;}
.top{position:sticky;top:0;z-index:10;background:rgba(13,13,15,.92);backdrop-filter:blur(10px);
  padding:16px 16px 12px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.top h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.3px;}
.top .gold{color:var(--gold);}
.top button.icon{background:none;border:none;color:var(--text);font-size:20px;padding:4px 8px;cursor:pointer;}
.content{flex:1;padding:14px 14px 90px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card.tap{cursor:pointer;}
.card.tap:active{background:var(--card2);}
.label{color:var(--sub);font-size:12.5px;margin-bottom:4px;}
.big{font-size:26px;font-weight:800;letter-spacing:.2px;}
.sub-row{display:flex;justify-content:space-between;margin-top:8px;font-size:13px;color:var(--sub);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.green{color:var(--green) !important;}
.red{color:var(--red) !important;}
.orange{color:var(--orange) !important;}
.gold-text{color:var(--gold) !important;}
.pill{display:inline-block;font-size:11.5px;padding:3px 9px;border-radius:20px;font-weight:600;}
.pill.paid{background:rgba(94,194,106,.15);color:var(--green);}
.pill.debt{background:rgba(217,83,79,.15);color:var(--red);}
.pill.partial{background:rgba(224,160,48,.15);color:var(--orange);}
.list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);}
.reorder-btn{background:var(--card2);border:1px solid var(--border);color:var(--sub);width:24px;height:20px;border-radius:5px;font-size:9px;cursor:pointer;padding:0;line-height:1;}
.reorder-btn:disabled{opacity:.25;}
.reorder-btn:not(:disabled):active{background:var(--border);color:var(--gold);}
.qty-stepper{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.qty-stepper button{width:42px;height:42px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--gold);font-size:20px;font-weight:700;cursor:pointer;flex-shrink:0;}
.qty-stepper button:active{background:var(--border);}
.qty-stepper input{text-align:center;margin-bottom:0;flex:1;}
.list-item:last-child{border-bottom:none;}
.list-item .l{flex:1;min-width:0;}
.list-item .name{font-weight:600;font-size:14.5px;}
.list-item .meta{color:var(--sub);font-size:12px;margin-top:2px;}
.list-item .amt{font-weight:700;font-size:14.5px;white-space:nowrap;margin-inline-start:10px;}
.bottomnav{position:fixed;bottom:0;left:0;right:0;background:rgba(21,21,24,.97);backdrop-filter:blur(12px);
  border-top:1px solid var(--border);display:flex;max-width:520px;margin:0 auto;
  padding-bottom:env(safe-area-inset-bottom);}
.bottomnav button{flex:1;background:none;border:none;color:var(--sub);font-size:10.5px;padding:9px 4px 8px;
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
.bottomnav button.active{color:var(--gold);}
.bottomnav svg{width:21px;height:21px;}
.drawer-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:30;}
.drawer{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--card);
  border-radius:20px 20px 0 0;padding:10px 8px calc(24px + env(safe-area-inset-bottom));z-index:31;
  max-height:75vh;overflow-y:auto;}
.drawer .handle{width:38px;height:4px;background:var(--border);border-radius:3px;margin:6px auto 14px;}
.drawer-item{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;font-size:15px;font-weight:600;}
.drawer-item:active{background:var(--card2);}
.drawer-item svg{width:19px;height:19px;color:var(--gold);}
button.primary{background:var(--gold);color:#151206;border:none;border-radius:12px;padding:13px;
  font-weight:700;font-size:15px;width:100%;cursor:pointer;}
button.primary:active{opacity:.85;}
button.secondary{background:var(--card2);color:var(--text);border:1px solid var(--border);border-radius:12px;
  padding:12px;font-weight:600;font-size:14px;width:100%;cursor:pointer;}
button.danger{background:rgba(217,83,79,.12);color:var(--red);border:1px solid rgba(217,83,79,.3);
  border-radius:10px;padding:10px;font-weight:600;font-size:13px;cursor:pointer;}
.fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:var(--gold);color:#151206;border:none;width:54px;height:54px;border-radius:50%;font-size:26px;
  box-shadow:0 6px 18px rgba(201,162,39,.35);z-index:20;cursor:pointer;max-width:520px;}
input,select,textarea{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
  border-radius:10px;padding:12px;font-size:15px;margin-bottom:12px;font-family:inherit;}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold-dim);}
label.field{display:block;font-size:12.5px;color:var(--sub);margin-bottom:6px;}
.field-wrap{margin-bottom:2px;}
.seg{display:flex;background:var(--card2);border-radius:10px;padding:3px;margin-bottom:12px;}
.seg button{flex:1;background:none;border:none;color:var(--sub);padding:9px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;}
.seg button.active{background:var(--gold);color:#151206;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:40;display:flex;align-items:flex-end;}
.modal{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:20px 20px 0 0;
  max-height:92vh;overflow-y:auto;padding:18px 16px calc(20px + env(safe-area-inset-bottom));}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;}
.modal-head h2{font-size:17px;margin:0;}
.modal-head button{background:none;border:none;color:var(--sub);font-size:22px;cursor:pointer;}
.empty{text-align:center;color:var(--sub);padding:36px 14px;font-size:14px;}
.err{background:rgba(217,83,79,.12);color:var(--red);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
.ok{background:rgba(94,194,106,.12);color:var(--green);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px;}
.section-title{font-size:13px;color:var(--sub);margin:18px 4px 8px;font-weight:600;}
.toggle-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;}
.center-screen{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;}
.logo-mark{text-align:center;margin-bottom:26px;}
.logo-mark .n{font-size:30px;font-weight:800;letter-spacing:1px;}
.logo-mark .n .x{color:var(--gold);}
.logo-mark .t{color:var(--sub);font-size:13px;margin-top:4px;}
a{color:var(--gold);}
.spinner{width:22px;height:22px;border:3px solid var(--border);border-top-color:var(--gold);border-radius:50%;
  animation:spin .7s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.help{font-size:12px;color:var(--sub);margin-top:-6px;margin-bottom:14px;line-height:1.6;}
</style>
</head>

<div id="app"><div class="spinner"></div></div>

<script>
/* ================= CONFIG / STORAGE ================= */
const LS_CFG = 'solix_finance_supabase_cfg';
const LS_LASTVIEW = 'solix_finance_last_view';
let supa = null;
let cfg = JSON.parse(localStorage.getItem(LS_CFG) || 'null');

const ACCOUNTS = {cash:'كاش', bank:'بنك', phone:'رصيد هاتف'};
const fmtLYD = n => (n<0?'-':'') + Math.abs(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2}) + ' د.ل';
const fmtUSD = n => '$' + (n<0?'-':'') + Math.abs(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtCost = p => (p.cost_currency==='LYD') ? fmtLYD(p.cost_lyd) : fmtUSD(p.cost_usd);
const fmtPct = n => (n>=0?'+':'') + (Math.round(n*10)/10) + '%';
const todayISO = () => new Date().toISOString().slice(0,10);
const uuid = () => crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);

/* ================= APP STATE ================= */
let S = {
  view:'dashboard', drawerOpen:false, modal:null,
  settings:null, balances:null, products:[], sales:[], debtPayments:[],
  usdPurchases:[], transfers:[], expenses:[], withdrawals:[], auditLogs:[],
  balanceSales:[], balanceSalePayments:[],
  loading:true, session:null, productCategoryFilter:null,
};

const app = document.getElementById('app');

/* ================= ICONS (inline svg, minimal) ================= */
const ICONS = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>',
  sales:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.7 13.4a2 2 0 0 0 2 1.6h9.7a2 2 0 0 0 2-1.6L23 6H6"/></svg>',
  ledger:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>',
  usd:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1.5h.5a2 2 0 1 1 0 4h-1a2 2 0 1 0 0 4h.5a2.5 2.5 0 0 0 2.5-1.5"/></svg>',
  balances:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 3H8a2 2 0 0 0-2 2v2h12V5a2 2 0 0 0-2-2z"/></svg>',
  debts:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0 1 16 0v1"/></svg>',
  expenses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  withdraw:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
  products:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/></svg>',
  reports:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 15l4-6 3 3 5-8"/></svg>',
  settings:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  chev:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>',
};


/* ================= EMBEDDED SETUP GUIDE (single-file build) ================= */
const SQL_SCHEMA_TEXT = "-- ============================================================\n-- SOLIX FINANCE \u2014 Supabase Database Schema\n-- ============================================================\n-- Run this once in Supabase: Dashboard \u2192 SQL Editor \u2192 New query \u2192 paste all \u2192 Run\n-- Safe to re-run: uses IF NOT EXISTS / CREATE OR REPLACE everywhere.\n-- ============================================================\n\ncreate extension if not exists \"pgcrypto\";\n\n-- ------------------------------------------------------------\n-- 1) SETTINGS  (single row: current exchange rate, initial USD capital)\n-- ------------------------------------------------------------\ncreate table if not exists settings (\n  id boolean primary key default true check (id),\n  current_exchange_rate numeric not null default 11.10,\n  initial_capital_usd numeric not null default 2000,\n  admin_password_hash text,               -- app-level password (in addition to Supabase Auth)\n  updated_at timestamptz not null default now()\n);\ninsert into settings (id) values (true) on conflict (id) do nothing;\n\n-- ------------------------------------------------------------\n-- 2) BALANCES  (single row: running LYD balances per account)\n-- ------------------------------------------------------------\ncreate table if not exists balances (\n  id boolean primary key default true check (id),\n  cash numeric not null default 0,\n  bank numeric not null default 0,\n  phone numeric not null default 0,\n  updated_at timestamptz not null default now()\n);\ninsert into balances (id) values (true) on conflict (id) do nothing;\n\n-- ------------------------------------------------------------\n-- 3) PRODUCTS\n-- ------------------------------------------------------------\ncreate table if not exists products (\n  id uuid primary key default gen_random_uuid(),\n  name text not null,\n  category text,\n  cost_usd numeric not null check (cost_usd >= 0),\n  active boolean not null default true,\n  notes text,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 4) SALES  (every row is a frozen snapshot \u2014 never recalculated later)\n-- ------------------------------------------------------------\ncreate table if not exists sales (\n  id uuid primary key default gen_random_uuid(),\n  product_id uuid references products(id),\n  product_name text not null,          -- snapshot, survives product edits/deletes\n  cost_usd numeric not null,           -- snapshot of product cost at sale time\n  quantity numeric not null default 1 check (quantity > 0),\n  exchange_rate numeric not null,      -- snapshot, frozen forever\n  cost_lyd numeric not null,           -- cost_usd * quantity * exchange_rate\n  selling_price_lyd numeric not null,  -- per unit\n  total_sales_lyd numeric not null,    -- selling_price_lyd * quantity\n  profit_lyd numeric not null,         -- total_sales_lyd - cost_lyd\n  payment_status text not null check (payment_status in ('paid','debt','partial')),\n  payment_account text check (payment_account in ('cash','bank','phone')),\n  customer_name text,\n  customer_phone text,\n  notes text,\n  paid_amount numeric not null default 0,\n  remaining_amount numeric not null default 0,\n  sale_date date not null default current_date,\n  deleted boolean not null default false,\n  created_at timestamptz not null default now(),\n  updated_at timestamptz not null default now()\n);\ncreate index if not exists idx_sales_date on sales(sale_date) where not deleted;\ncreate index if not exists idx_sales_status on sales(payment_status) where not deleted;\n\n-- ------------------------------------------------------------\n-- 5) DEBT PAYMENTS\n-- ------------------------------------------------------------\ncreate table if not exists debt_payments (\n  id uuid primary key default gen_random_uuid(),\n  sale_id uuid not null references sales(id),\n  amount numeric not null check (amount > 0),\n  account text not null check (account in ('cash','bank','phone')),\n  payment_date date not null default current_date,\n  note text,\n  deleted boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 6) USD PURCHASES  (buying dollars back)\n-- ------------------------------------------------------------\ncreate table if not exists usd_purchases (\n  id uuid primary key default gen_random_uuid(),\n  amount_usd numeric not null check (amount_usd > 0),\n  rate numeric not null check (rate > 0),\n  total_paid_lyd numeric not null,\n  source_account text not null check (source_account in ('cash','bank','phone')),\n  purchase_date date not null default current_date,\n  note text,\n  deleted boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 7) TRANSFERS  (between cash/bank/phone \u2014 never touches profit)\n-- ------------------------------------------------------------\ncreate table if not exists transfers (\n  id uuid primary key default gen_random_uuid(),\n  from_account text not null check (from_account in ('cash','bank','phone')),\n  to_account text not null check (to_account in ('cash','bank','phone')),\n  amount numeric not null check (amount > 0),\n  transfer_date date not null default current_date,\n  note text,\n  created_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 8) STORE EXPENSES\n-- ------------------------------------------------------------\ncreate table if not exists expenses (\n  id uuid primary key default gen_random_uuid(),\n  amount numeric not null check (amount > 0),\n  account text not null check (account in ('cash','bank','phone')),\n  category text,\n  expense_date date not null default current_date,\n  note text,\n  deleted boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 9) PERSONAL WITHDRAWALS  (separate from store expenses; never reduces profit)\n-- ------------------------------------------------------------\ncreate table if not exists personal_withdrawals (\n  id uuid primary key default gen_random_uuid(),\n  amount numeric not null check (amount > 0),\n  source_account text not null check (source_account in ('cash','bank','phone')),\n  withdrawal_date date not null default current_date,\n  note text,\n  deleted boolean not null default false,\n  created_at timestamptz not null default now()\n);\n\n-- ------------------------------------------------------------\n-- 10) AUDIT LOG\n-- ------------------------------------------------------------\ncreate table if not exists audit_logs (\n  id uuid primary key default gen_random_uuid(),\n  entity_type text not null,\n  entity_id uuid,\n  action text not null,               -- created / updated / deleted\n  old_value jsonb,\n  new_value jsonb,\n  created_at timestamptz not null default now(),\n  created_by uuid default auth.uid()\n);\n\n-- ============================================================\n-- ROW LEVEL SECURITY\n-- Single-admin app: any authenticated user may read/write.\n-- \u26a0\ufe0f In Supabase Dashboard \u2192 Authentication \u2192 Providers, disable\n--    \"Allow new users to sign up\" after creating your one admin account.\n-- ============================================================\ndo $$\ndeclare t text;\nbegin\n  for t in select unnest(array[\n    'settings','balances','products','sales','debt_payments',\n    'usd_purchases','transfers','expenses','personal_withdrawals','audit_logs'\n  ])\n  loop\n    execute format('alter table %I enable row level security;', t);\n    execute format('drop policy if exists \"auth full access\" on %I;', t);\n    execute format(\n      'create policy \"auth full access\" on %I for all using (auth.role() = ''authenticated'') with check (auth.role() = ''authenticated'');',\n      t\n    );\n  end loop;\nend $$;\n\n-- ============================================================\n-- RPC FUNCTIONS \u2014 every money-moving action is atomic.\n-- Called from the app via supabase.rpc('fn_name', {...})\n-- ============================================================\n\n-- ---------- ADD SALE ----------\ncreate or replace function fn_add_sale(\n  p_product_id uuid,\n  p_quantity numeric,\n  p_exchange_rate numeric,\n  p_selling_price_lyd numeric,\n  p_payment_status text,\n  p_payment_account text,\n  p_customer_name text,\n  p_customer_phone text,\n  p_notes text,\n  p_paid_amount numeric,\n  p_sale_date date\n) returns uuid\nlanguage plpgsql\nas $$\ndeclare\n  v_product products;\n  v_cost_lyd numeric;\n  v_total_sales_lyd numeric;\n  v_profit_lyd numeric;\n  v_remaining numeric;\n  v_sale_id uuid;\nbegin\n  select * into v_product from products where id = p_product_id;\n  if not found then raise exception 'Product not found'; end if;\n\n  v_cost_lyd := v_product.cost_usd * p_quantity * p_exchange_rate;\n  v_total_sales_lyd := p_selling_price_lyd * p_quantity;\n  v_profit_lyd := v_total_sales_lyd - v_cost_lyd;\n  v_remaining := v_total_sales_lyd - coalesce(p_paid_amount, 0);\n\n  insert into sales (\n    product_id, product_name, cost_usd, quantity, exchange_rate,\n    cost_lyd, selling_price_lyd, total_sales_lyd, profit_lyd,\n    payment_status, payment_account, customer_name, customer_phone, notes,\n    paid_amount, remaining_amount, sale_date\n  ) values (\n    p_product_id, v_product.name, v_product.cost_usd, p_quantity, p_exchange_rate,\n    v_cost_lyd, p_selling_price_lyd, v_total_sales_lyd, v_profit_lyd,\n    p_payment_status, p_payment_account, p_customer_name, p_customer_phone, p_notes,\n    coalesce(p_paid_amount, 0), greatest(v_remaining, 0), p_sale_date\n  ) returning id into v_sale_id;\n\n  if coalesce(p_paid_amount, 0) > 0 and p_payment_account is not null then\n    execute format('update balances set %I = %I + $1, updated_at = now() where id = true', p_payment_account, p_payment_account)\n      using p_paid_amount;\n  end if;\n\n  insert into audit_logs (entity_type, entity_id, action, new_value)\n    values ('sale', v_sale_id, 'created', to_jsonb((select s from sales s where id = v_sale_id)));\n\n  return v_sale_id;\nend;\n$$;\n\n-- ---------- EDIT SALE ----------\ncreate or replace function fn_edit_sale(\n  p_sale_id uuid,\n  p_quantity numeric,\n  p_exchange_rate numeric,\n  p_selling_price_lyd numeric,\n  p_payment_status text,\n  p_payment_account text,\n  p_customer_name text,\n  p_customer_phone text,\n  p_notes text,\n  p_paid_amount numeric,\n  p_sale_date date\n) returns void\nlanguage plpgsql\nas $$\ndeclare\n  v_old sales;\n  v_cost_lyd numeric;\n  v_total_sales_lyd numeric;\n  v_profit_lyd numeric;\n  v_remaining numeric;\nbegin\n  select * into v_old from sales where id = p_sale_id and not deleted;\n  if not found then raise exception 'Sale not found'; end if;\n\n  -- reverse old balance effect\n  if v_old.paid_amount > 0 and v_old.payment_account is not null then\n    execute format('update balances set %I = %I - $1, updated_at = now() where id = true', v_old.payment_account, v_old.payment_account)\n      using v_old.paid_amount;\n  end if;\n\n  v_cost_lyd := v_old.cost_usd * p_quantity * p_exchange_rate;\n  v_total_sales_lyd := p_selling_price_lyd * p_quantity;\n  v_profit_lyd := v_total_sales_lyd - v_cost_lyd;\n  v_remaining := v_total_sales_lyd - coalesce(p_paid_amount, 0);\n\n  update sales set\n    quantity = p_quantity,\n    exchange_rate = p_exchange_rate,\n    cost_lyd = v_cost_lyd,\n    selling_price_lyd = p_selling_price_lyd,\n    total_sales_lyd = v_total_sales_lyd,\n    profit_lyd = v_profit_lyd,\n    payment_status = p_payment_status,\n    payment_account = p_payment_account,\n    customer_name = p_customer_name,\n    customer_phone = p_customer_phone,\n    notes = p_notes,\n    paid_amount = coalesce(p_paid_amount, 0),\n    remaining_amount = greatest(v_remaining, 0),\n    sale_date = p_sale_date,\n    updated_at = now()\n  where id = p_sale_id;\n\n  if coalesce(p_paid_amount, 0) > 0 and p_payment_account is not null then\n    execute format('update balances set %I = %I + $1, updated_at = now() where id = true', p_payment_account, p_payment_account)\n      using p_paid_amount;\n  end if;\n\n  insert into audit_logs (entity_type, entity_id, action, old_value, new_value)\n    values ('sale', p_sale_id, 'updated', to_jsonb(v_old), to_jsonb((select s from sales s where id = p_sale_id)));\nend;\n$$;\n\n-- ---------- DELETE SALE (soft) ----------\ncreate or replace function fn_delete_sale(p_sale_id uuid) returns void\nlanguage plpgsql\nas $$\ndeclare v_old sales;\nbegin\n  select * into v_old from sales where id = p_sale_id and not deleted;\n  if not found then raise exception 'Sale not found'; end if;\n\n  if v_old.paid_amount > 0 and v_old.payment_account is not null then\n    execute format('update balances set %I = %I - $1, updated_at = now() where id = true', v_old.payment_account, v_old.payment_account)\n      using v_old.paid_amount;\n  end if;\n\n  update sales set deleted = true, updated_at = now() where id = p_sale_id;\n\n  insert into audit_logs (entity_type, entity_id, action, old_value)\n    values ('sale', p_sale_id, 'deleted', to_jsonb(v_old));\nend;\n$$;\n\n-- ---------- PAY DEBT ----------\ncreate or replace function fn_pay_debt(\n  p_sale_id uuid,\n  p_amount numeric,\n  p_account text,\n  p_payment_date date,\n  p_note text\n) returns void\nlanguage plpgsql\nas $$\ndeclare\n  v_sale sales;\n  v_new_paid numeric;\n  v_new_remaining numeric;\n  v_new_status text;\nbegin\n  select * into v_sale from sales where id = p_sale_id and not deleted;\n  if not found then raise exception 'Sale not found'; end if;\n  if p_amount <= 0 then raise exception 'Amount must be positive'; end if;\n  if p_amount > v_sale.remaining_amount then raise exception 'Amount exceeds remaining debt'; end if;\n\n  v_new_paid := v_sale.paid_amount + p_amount;\n  v_new_remaining := v_sale.total_sales_lyd - v_new_paid;\n  v_new_status := case when v_new_remaining <= 0 then 'paid' else 'partial' end;\n\n  insert into debt_payments (sale_id, amount, account, payment_date, note)\n    values (p_sale_id, p_amount, p_account, p_payment_date, p_note);\n\n  update sales set\n    paid_amount = v_new_paid,\n    remaining_amount = greatest(v_new_remaining, 0),\n    payment_status = v_new_status,\n    payment_account = coalesce(payment_account, p_account),\n    updated_at = now()\n  where id = p_sale_id;\n\n  execute format('update balances set %I = %I + $1, updated_at = now() where id = true', p_account, p_account)\n    using p_amount;\n\n  insert into audit_logs (entity_type, entity_id, action, old_value, new_value)\n    values ('debt_payment', p_sale_id, 'created',\n      jsonb_build_object('paid_amount', v_sale.paid_amount, 'remaining_amount', v_sale.remaining_amount),\n      jsonb_build_object('paid_amount', v_new_paid, 'remaining_amount', greatest(v_new_remaining,0)));\nend;\n$$;\n\n-- ---------- BUY USD ----------\ncreate or replace function fn_buy_usd(\n  p_amount_usd numeric,\n  p_rate numeric,\n  p_total_paid_lyd numeric,\n  p_source_account text,\n  p_purchase_date date,\n  p_note text\n) returns uuid\nlanguage plpgsql\nas $$\ndeclare v_id uuid;\nbegin\n  insert into usd_purchases (amount_usd, rate, total_paid_lyd, source_account, purchase_date, note)\n    values (p_amount_usd, p_rate, p_total_paid_lyd, p_source_account, p_purchase_date, p_note)\n    returning id into v_id;\n\n  execute format('update balances set %I = %I - $1, updated_at = now() where id = true', p_source_account, p_source_account)\n    using p_total_paid_lyd;\n\n  insert into audit_logs (entity_type, entity_id, action, new_value)\n    values ('usd_purchase', v_id, 'created', to_jsonb((select u from usd_purchases u where id = v_id)));\n\n  return v_id;\nend;\n$$;\n\n-- ---------- TRANSFER ----------\ncreate or replace function fn_transfer(\n  p_from_account text,\n  p_to_account text,\n  p_amount numeric,\n  p_transfer_date date,\n  p_note text\n) returns uuid\nlanguage plpgsql\nas $$\ndeclare v_id uuid;\nbegin\n  if p_from_account = p_to_account then raise exception 'Cannot transfer to the same account'; end if;\n\n  insert into transfers (from_account, to_account, amount, transfer_date, note)\n    values (p_from_account, p_to_account, p_amount, p_transfer_date, p_note)\n    returning id into v_id;\n\n  execute format('update balances set %I = %I - $1, %I = %I + $1, updated_at = now() where id = true',\n    p_from_account, p_from_account, p_to_account, p_to_account) using p_amount;\n\n  insert into audit_logs (entity_type, entity_id, action, new_value)\n    values ('transfer', v_id, 'created', to_jsonb((select t from transfers t where id = v_id)));\n\n  return v_id;\nend;\n$$;\n\n-- ---------- ADD EXPENSE ----------\ncreate or replace function fn_add_expense(\n  p_amount numeric,\n  p_account text,\n  p_category text,\n  p_expense_date date,\n  p_note text\n) returns uuid\nlanguage plpgsql\nas $$\ndeclare v_id uuid;\nbegin\n  insert into expenses (amount, account, category, expense_date, note)\n    values (p_amount, p_account, p_category, p_expense_date, p_note)\n    returning id into v_id;\n\n  execute format('update balances set %I = %I - $1, updated_at = now() where id = true', p_account, p_account)\n    using p_amount;\n\n  insert into audit_logs (entity_type, entity_id, action, new_value)\n    values ('expense', v_id, 'created', to_jsonb((select e from expenses e where id = v_id)));\n\n  return v_id;\nend;\n$$;\n\n-- ---------- ADD WITHDRAWAL ----------\ncreate or replace function fn_add_withdrawal(\n  p_amount numeric,\n  p_source_account text,\n  p_withdrawal_date date,\n  p_note text\n) returns uuid\nlanguage plpgsql\nas $$\ndeclare v_id uuid;\nbegin\n  insert into personal_withdrawals (amount, source_account, withdrawal_date, note)\n    values (p_amount, p_source_account, p_withdrawal_date, p_note)\n    returning id into v_id;\n\n  execute format('update balances set %I = %I - $1, updated_at = now() where id = true', p_source_account, p_source_account)\n    using p_amount;\n\n  insert into audit_logs (entity_type, entity_id, action, new_value)\n    values ('withdrawal', v_id, 'created', to_jsonb((select w from personal_withdrawals w where id = v_id)));\n\n  return v_id;\nend;\n$$;\n\n-- ---------- SOFT DELETE (generic, for expenses/withdrawals/usd_purchases) ----------\ncreate or replace function fn_soft_delete_expense(p_id uuid) returns void\nlanguage plpgsql as $$\ndeclare v_old expenses;\nbegin\n  select * into v_old from expenses where id = p_id and not deleted;\n  if not found then raise exception 'Not found'; end if;\n  execute format('update balances set %I = %I + $1, updated_at = now() where id = true', v_old.account, v_old.account) using v_old.amount;\n  update expenses set deleted = true where id = p_id;\n  insert into audit_logs (entity_type, entity_id, action, old_value) values ('expense', p_id, 'deleted', to_jsonb(v_old));\nend; $$;\n\ncreate or replace function fn_soft_delete_withdrawal(p_id uuid) returns void\nlanguage plpgsql as $$\ndeclare v_old personal_withdrawals;\nbegin\n  select * into v_old from personal_withdrawals where id = p_id and not deleted;\n  if not found then raise exception 'Not found'; end if;\n  execute format('update balances set %I = %I + $1, updated_at = now() where id = true', v_old.source_account, v_old.source_account) using v_old.amount;\n  update personal_withdrawals set deleted = true where id = p_id;\n  insert into audit_logs (entity_type, entity_id, action, old_value) values ('withdrawal', p_id, 'deleted', to_jsonb(v_old));\nend; $$;\n\ncreate or replace function fn_soft_delete_usd_purchase(p_id uuid) returns void\nlanguage plpgsql as $$\ndeclare v_old usd_purchases;\nbegin\n  select * into v_old from usd_purchases where id = p_id and not deleted;\n  if not found then raise exception 'Not found'; end if;\n  execute format('update balances set %I = %I + $1, updated_at = now() where id = true', v_old.source_account, v_old.source_account) using v_old.total_paid_lyd;\n  update usd_purchases set deleted = true where id = p_id;\n  insert into audit_logs (entity_type, entity_id, action, old_value) values ('usd_purchase', p_id, 'deleted', to_jsonb(v_old));\nend; $$;\n\n-- ============================================================\n-- USD BALANCE VIEW  (initial capital + purchases \u2212 cost of all sales)\n-- ============================================================\ncreate or replace view v_usd_summary as\nselect\n  s.initial_capital_usd\n    + coalesce((select sum(amount_usd) from usd_purchases where not deleted), 0)\n    - coalesce((select sum(cost_usd * quantity) from sales where not deleted), 0) as usd_balance,\n  coalesce((select sum(amount_usd) from usd_purchases where not deleted), 0) as total_purchased_usd,\n  coalesce((select sum(cost_usd * quantity) from sales where not deleted), 0) as total_outflow_usd,\n  case when (select sum(amount_usd) from usd_purchases where not deleted) > 0\n    then (select sum(amount_usd * rate) from usd_purchases where not deleted)\n         / (select sum(amount_usd) from usd_purchases where not deleted)\n    else null\n  end as average_usd_cost\nfrom settings s;\n\n-- ============================================================\n-- Done. Next: create your admin user in\n-- Authentication \u2192 Users \u2192 Add user, then disable public sign-ups.\n-- ============================================================\n";
const SETUP_GUIDE_TEXT = "# SOLIX Finance \u2014 \u062f\u0644\u064a\u0644 \u0627\u0644\u0625\u0639\u062f\u0627\u062f \u0648\u0627\u0644\u0646\u0634\u0631\n\n## 1) \u0625\u0646\u0634\u0627\u0621 \u0645\u0634\u0631\u0648\u0639 Supabase (\u0645\u062c\u0627\u0646\u064a)\n1. \u0631\u0648\u062d \u0644\u0640 https://supabase.com \u2192 \u0623\u0646\u0634\u0626 \u062d\u0633\u0627\u0628 \u2192 **New Project**.\n2. \u0627\u062e\u062a\u0627\u0631 \u0627\u0633\u0645 (\u0645\u062b\u0644\u0627\u064b `solix-finance`) \u0648\u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 \u0644\u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a (\u0627\u062d\u0641\u0638\u0647\u0627 \u0628\u0645\u0643\u0627\u0646 \u0622\u0645\u0646).\n3. \u0627\u0633\u062a\u0646\u0649 \u062f\u0642\u064a\u0642\u062a\u064a\u0646 \u062d\u062a\u0649 \u064a\u062c\u0647\u0632 \u0627\u0644\u0645\u0634\u0631\u0648\u0639.\n\n## 2) \u062a\u0634\u063a\u064a\u0644 \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a\n1. \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629: **SQL Editor** \u2192 **New query**.\n2. \u0627\u0641\u062a\u062d \u0645\u0644\u0641 `schema.sql` (\u0627\u0644\u0645\u0631\u0641\u0642)\u060c \u0627\u0646\u0633\u062e \u0643\u0644 \u0627\u0644\u0645\u062d\u062a\u0648\u0649\u060c \u062d\u0637\u0648 \u0641\u064a \u0627\u0644\u0645\u062d\u0631\u0631\u060c \u0627\u0636\u063a\u0637 **Run**.\n3. \u062a\u0623\u0643\u062f \u0645\u0627 \u0638\u0647\u0631\u0634 \u0623\u064a \u062e\u0637\u0623 \u0623\u062d\u0645\u0631.\n\n## 3) \u0625\u0646\u0634\u0627\u0621 \u062d\u0633\u0627\u0628 \u0627\u0644\u0623\u062f\u0645\u0646 (\u0623\u0646\u062a)\n1. \u0645\u0646 \u0627\u0644\u0642\u0627\u0626\u0645\u0629 \u0627\u0644\u062c\u0627\u0646\u0628\u064a\u0629: **Authentication \u2192 Users \u2192 Add user**.\n2. \u062d\u0637 \u0625\u064a\u0645\u064a\u0644\u0643 \u0648\u0643\u0644\u0645\u0629 \u0645\u0631\u0648\u0631 (\u0647\u0630\u064a \u0647\u064a \u0627\u0644\u0644\u064a \u062a\u0633\u062c\u0644 \u0628\u064a\u0647\u0627 \u062f\u062e\u0648\u0644 \u0644\u0644\u062a\u0637\u0628\u064a\u0642).\n3. **\u0645\u0647\u0645 \u062c\u062f\u064b\u0627 \u0644\u0644\u0623\u0645\u0627\u0646:** \u0631\u0648\u062d \u0644\u0640 **Authentication \u2192 Providers \u2192 Email** \u0648\u0623\u0637\u0641\u064a \u062e\u064a\u0627\u0631 **\"Allow new users to sign up\"** \u2014 \u0647\u0643\u0630\u0627 \u062d\u062a\u0649 \u062d\u062f \u0622\u062e\u0631 \u0645\u0627 \u064a\u0642\u062f\u0631\u0634 \u064a\u0633\u062c\u0644 \u062d\u0633\u0627\u0628 \u062c\u062f\u064a\u062f \u0641\u064a \u062a\u0637\u0628\u064a\u0642\u0643.\n\n## 4) \u0627\u0644\u062d\u0635\u0648\u0644 \u0639\u0644\u0649 \u0645\u0641\u0627\u062a\u064a\u062d \u0627\u0644\u0631\u0628\u0637\n1. **Project Settings (\u2699\ufe0f) \u2192 API**.\n2. \u0627\u0646\u0633\u062e:\n   - **Project URL** (\u0634\u0643\u0644\u0647\u0627 `https://xxxxx.supabase.co`)\n   - **anon public key** (\u0645\u0641\u062a\u0627\u062d \u0637\u0648\u064a\u0644 \u064a\u0628\u062f\u0623 \u0628\u0640 `eyJ...`)\n\n## 5) \u062a\u0634\u063a\u064a\u0644 \u0627\u0644\u062a\u0637\u0628\u064a\u0642 \u0623\u0648\u0644 \u0645\u0631\u0629\n1. \u0627\u0641\u062a\u062d `index.html` (\u0645\u062d\u0644\u064a\u064b\u0627 \u0623\u0648 \u0628\u0639\u062f \u0627\u0644\u0646\u0634\u0631\u060c \u062e\u0637\u0648\u0629 6).\n2. \u0641\u064a \u0634\u0627\u0634\u0629 \"\u0627\u0644\u0625\u0639\u062f\u0627\u062f \u0627\u0644\u0623\u0648\u0644\"\u060c \u0627\u0644\u0635\u0642 \u0627\u0644\u0640 Project URL \u0648\u0627\u0644\u0640 anon key\u060c \u0627\u0636\u063a\u0637 **\u062d\u0641\u0638 \u0648\u0645\u062a\u0627\u0628\u0639\u0629**.\n3. \u0633\u062c\u0644 \u062f\u062e\u0648\u0644 \u0628\u0627\u0644\u0625\u064a\u0645\u064a\u0644 \u0648\u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u0627\u0644\u0644\u064a \u0639\u0645\u0644\u062a\u0647\u0645 \u0641\u064a \u062e\u0637\u0648\u0629 3.\n\n\u0647\u0630\u064a \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a (URL + anon key) \u062a\u062a\u062e\u0632\u0646 \u0641\u064a \u0627\u0644\u0645\u062a\u0635\u0641\u062d \u062a\u0627\u0639\u0643 \u0641\u0642\u0637 (`localStorage`) \u2014 \u0645\u0627 \u062a\u0646\u0628\u0639\u062a\u0634 \u0644\u0623\u064a \u0645\u0643\u0627\u0646 \u0622\u062e\u0631\u060c \u0648\u0647\u064a \u0645\u0641\u062a\u0627\u062d \u0639\u0627\u0645 \u0622\u0645\u0646 \u0644\u0644\u0627\u0633\u062a\u062e\u062f\u0627\u0645 \u0641\u064a \u0627\u0644\u0648\u0627\u062c\u0647\u0629 (\u0627\u0644\u062d\u0645\u0627\u064a\u0629 \u0627\u0644\u062d\u0642\u064a\u0642\u064a\u0629 \u0645\u0648\u062c\u0648\u062f\u0629 \u0641\u064a \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0646\u0641\u0633\u0647\u0627 \u0639\u0628\u0631 RLS).\n\n## 6) \u0627\u0644\u0646\u0634\u0631 \u0643\u0645\u0648\u0642\u0639 \u0645\u0633\u062a\u0642\u0644 (\u0627\u062e\u062a\u064a\u0627\u0631\u064a \u0644\u0643\u0646 \u0645\u0648\u0635\u0649 \u0628\u064a\u0647)\n\u0646\u0641\u0633 \u0637\u0631\u064a\u0642\u0629 SOLIX \u0627\u0644\u0633\u062a\u0648\u0631:\n1. \u0623\u0646\u0634\u0626 \u0645\u0633\u062a\u0648\u062f\u0639 GitHub \u062c\u062f\u064a\u062f (\u062e\u0627\u0635/Private \u0623\u0641\u0636\u0644 \u0644\u0623\u0646\u0647 \u0628\u064a\u0627\u0646\u0627\u062a \u0645\u0627\u0644\u064a\u0629).\n2. \u0627\u0631\u0641\u0639 `index.html` + `manifest.json` (\u0648 \u0623\u064a \u0623\u064a\u0642\u0648\u0646\u0627\u062a \u062a\u062d\u0628 \u062a\u0636\u064a\u0641\u0647\u0627 `icon-192.png` / `icon-512.png`).\n3. \u0645\u0646 \u0625\u0639\u062f\u0627\u062f\u0627\u062a \u0627\u0644\u0645\u0633\u062a\u0648\u062f\u0639: **Settings \u2192 Pages \u2192 Deploy from branch \u2192 main**.\n4. \u0628\u0639\u062f \u062f\u0642\u064a\u0642\u0629 \u0623\u0648 \u0627\u062b\u0646\u064a\u0646\u060c \u0627\u0644\u0631\u0627\u0628\u0637 \u062a\u0627\u0639\u0643 \u064a\u062e\u062f\u0645 \u2014 \u062a\u0642\u062f\u0631 \u062a\u0641\u062a\u062d\u0648 \u0645\u0646 \u0623\u064a \u062c\u0647\u0627\u0632/\u0645\u062a\u0635\u0641\u062d.\n5. \u0639\u0644\u0649 \u0627\u0644\u0622\u064a\u0641\u0648\u0646: \u0627\u0641\u062a\u062d \u0627\u0644\u0631\u0627\u0628\u0637 \u0641\u064a Safari \u2192 \u0632\u0631 \u0627\u0644\u0645\u0634\u0627\u0631\u0643\u0629 \u2192 **\u0625\u0636\u0627\u0641\u0629 \u0625\u0644\u0649 \u0627\u0644\u0634\u0627\u0634\u0629 \u0627\u0644\u0631\u0626\u064a\u0633\u064a\u0629** \u2192 \u064a\u0635\u064a\u0631 \u062a\u0637\u0628\u064a\u0642 \u0645\u062b\u0628\u062a (PWA).\n\n## 7) \u0627\u062e\u062a\u0628\u0627\u0631 \u0627\u0644\u0646\u0638\u0627\u0645 (\u0646\u0641\u0633 \u0623\u0645\u062b\u0644\u0629 \u0627\u0644\u0645\u0648\u0627\u0635\u0641\u0627\u062a)\n\u0628\u0639\u062f \u0623\u0648\u0644 \u062a\u0633\u062c\u064a\u0644 \u062f\u062e\u0648\u0644\u060c \u0645\u0646 **\u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a** \u0627\u0636\u0628\u0637:\n- \u0631\u0623\u0633 \u0627\u0644\u0645\u0627\u0644 \u0627\u0644\u0627\u0628\u062a\u062f\u0627\u0626\u064a = `2000`\n- \u0633\u0639\u0631 \u0627\u0644\u0635\u0631\u0641 \u0627\u0644\u062d\u0627\u0644\u064a = `11.10`\n- \u0627\u0644\u0623\u0631\u0635\u062f\u0629 (\u0643\u0627\u0634/\u0628\u0646\u0643/\u0647\u0627\u062a\u0641) = \u062d\u0633\u0628 \u0648\u0636\u0639\u0643 \u0627\u0644\u062d\u0642\u064a\u0642\u064a\u060c \u0623\u0648 `0` \u0648\u062a\u0636\u0628\u0637\u0647\u0645 \u0628\u0639\u062f\u064a\u0646.\n\n\u062b\u0645 \u062c\u0631\u0628 \u0628\u0627\u0644\u062a\u0631\u062a\u064a\u0628:\n1. **\u0645\u0646\u062a\u062c:** \u0623\u0636\u0641 \"iTunes $10\" \u0628\u062a\u0643\u0644\u0641\u0629 `$10`.\n2. **\u0628\u064a\u0639 \u0645\u062f\u0641\u0648\u0639:** \u0628\u064a\u0639\u0647 \u0628\u0640 `120 \u062f.\u0644` \u0643\u0627\u0634 \u2192 \u0627\u0644\u0645\u062a\u0648\u0642\u0639: \u0627\u0644\u062f\u0648\u0644\u0627\u0631 `$1,990`\u060c \u0627\u0644\u0643\u0627\u0634 `+120`\u060c \u0627\u0644\u0631\u0628\u062d `9 \u062f.\u0644`.\n3. **\u063a\u064a\u0651\u0631 \u0633\u0639\u0631 \u0627\u0644\u0635\u0631\u0641** \u0625\u0644\u0649 `12.00` \u0645\u0646 \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a \u2192 \u062a\u0623\u0643\u062f \u0627\u0644\u0639\u0645\u0644\u064a\u0629 \u0627\u0644\u0642\u062f\u064a\u0645\u0629 \u0645\u0627 \u062a\u063a\u064a\u0631\u062a\u0634 (\u0644\u0633\u0627 `11.10`).\n4. **\u0634\u0631\u0627\u0621 \u062f\u0648\u0644\u0627\u0631:** `$100` \u0628\u0633\u0639\u0631 `12.00` (\u0625\u062c\u0645\u0627\u0644\u064a `1,200 \u062f.\u0644` \u0645\u0646 \u0627\u0644\u0643\u0627\u0634) \u2192 \u0627\u0644\u0645\u062a\u0648\u0642\u0639: \u0627\u0644\u062f\u0648\u0644\u0627\u0631 `$2,090`\u060c \u0627\u0644\u0643\u0627\u0634 `-1,200`.\n5. **\u0628\u064a\u0639 \u0628\u0627\u0644\u062f\u064a\u0646:** \u0644\u0623\u062d\u0645\u062f \u0628\u0640 `120 \u062f.\u0644` \u2192 \u0627\u0644\u0645\u062a\u0648\u0642\u0639: \u0627\u0644\u062f\u0648\u0644\u0627\u0631 \u064a\u0646\u0642\u0635 `$10`\u060c \u0645\u0627 \u064a\u062a\u0632\u0627\u062f\u0634 \u0634\u064a\u0621 \u0641\u064a \u0627\u0644\u0643\u0627\u0634\u060c \u0627\u0644\u062f\u064a\u0646 `120 \u062f.\u0644`.\n6. **\u062a\u0633\u062f\u064a\u062f \u062c\u0632\u0626\u064a:** \u0623\u062d\u0645\u062f \u064a\u062f\u0641\u0639 `50 \u062f.\u0644` \u0643\u0627\u0634 \u2192 \u0627\u0644\u0645\u062a\u0628\u0642\u064a `70 \u062f.\u0644`\u060c \u0627\u0644\u0643\u0627\u0634 `+50`.\n7. **\u062a\u062d\u0648\u064a\u0644:** `500 \u062f.\u0644` \u0645\u0646 \u0643\u0627\u0634 \u0644\u0628\u0646\u0643 \u2192 \u0627\u0644\u0631\u0628\u062d \u0648\u0627\u0644\u0645\u0628\u064a\u0639\u0627\u062a \u0648\u0627\u0644\u062f\u0648\u0644\u0627\u0631 \u0645\u0627 \u064a\u062a\u0623\u062b\u0631\u0648\u0634.\n8. **\u0645\u0635\u0631\u0648\u0641:** `100 \u062f.\u0644` \u0645\u0646 \u0627\u0644\u0643\u0627\u0634 (\u062a\u0635\u0646\u064a\u0641 \"\u0625\u0639\u0644\u0627\u0646\u0627\u062a\") \u2192 \u0627\u0644\u0643\u0627\u0634 `-100`\u060c \u0645\u0635\u0631\u0648\u0641\u0627\u062a \u0627\u0644\u0645\u062a\u062c\u0631 `+100`.\n9. **\u0633\u062d\u0628 \u0634\u062e\u0635\u064a:** `200 \u062f.\u0644` \u0645\u0646 \u0627\u0644\u0643\u0627\u0634 \u2192 \u0627\u0644\u0643\u0627\u0634 `-200`\u060c \u0644\u0643\u0646 \u0631\u0628\u062d \u0627\u0644\u0645\u062a\u062c\u0631 \u0645\u0627 \u064a\u062a\u0623\u062b\u0631\u0634.\n\n\u0625\u0630\u0627 \u0643\u0644 \u0646\u062a\u064a\u062c\u0629 \u0637\u0627\u0628\u0642\u062a \u0627\u0644\u0645\u062a\u0648\u0642\u0639\u060c \u0627\u0644\u0646\u0638\u0627\u0645 \u0634\u063a\u0627\u0644 \u0635\u062d 100%. \u2705\n\n## \u0645\u0644\u0627\u062d\u0638\u0627\u062a \u0623\u0645\u0627\u0646 \u0645\u0647\u0645\u0629\n- \u0647\u0630\u0627 \u0646\u0638\u0627\u0645 **\u0623\u062f\u0645\u0646 \u0648\u0627\u062d\u062f**. \u0644\u0627 \u062a\u0634\u0627\u0631\u0643 \u0631\u0627\u0628\u0637 \u0627\u0644\u0645\u0634\u0631\u0648\u0639 \u0623\u0648 \u0645\u0641\u062a\u0627\u062d \u0627\u0644\u0640 anon key \u0645\u0639 \u062d\u062f.\n- \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631 \u062a\u0627\u0639\u0643 \u0645\u062d\u0641\u0648\u0638\u0629 \u0628\u0623\u0645\u0627\u0646 \u0639\u0646\u062f Supabase (\u0645\u0634 \u0639\u0646\u062f\u064a \u0623\u0646\u0627 \u0648\u0644\u0627 \u0641\u064a \u0627\u0644\u0643\u0648\u062f).\n- \u0643\u0644 \u0639\u0645\u0644\u064a\u0629 \u0645\u0627\u0644\u064a\u0629 (\u0628\u064a\u0639\u060c \u0634\u0631\u0627\u0621 \u062f\u0648\u0644\u0627\u0631\u060c \u062a\u062d\u0648\u064a\u0644\u060c \u0645\u0635\u0631\u0648\u0641\u060c \u0633\u062d\u0628) \u062a\u062a\u0633\u062c\u0644 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627 \u0641\u064a **\u0633\u062c\u0644 \u0627\u0644\u062a\u0639\u062f\u064a\u0644\u0627\u062a (Audit Log)** \u0645\u0646 \u0627\u0644\u0625\u0639\u062f\u0627\u062f\u0627\u062a.\n- \u0627\u0644\u062d\u0630\u0641 \u0641\u064a \u0627\u0644\u0646\u0638\u0627\u0645 \"Soft Delete\" \u2014 \u0623\u064a \u0639\u0645\u0644\u064a\u0629 \u062a\u062a\u062d\u0630\u0641 \u062a\u062e\u062a\u0641\u064a \u0645\u0646 \u0627\u0644\u0648\u0627\u062c\u0647\u0629 \u0644\u0643\u0646 \u062a\u0628\u0642\u0649 \u0645\u062d\u0641\u0648\u0638\u0629 \u0641\u064a \u0642\u0627\u0639\u062f\u0629 \u0627\u0644\u0628\u064a\u0627\u0646\u0627\u062a \u0645\u0639 \u0639\u0643\u0633 \u0623\u062b\u0631\u0647\u0627 \u0639\u0644\u0649 \u0627\u0644\u0623\u0631\u0635\u062f\u0629 \u062a\u0644\u0642\u0627\u0626\u064a\u064b\u0627.\n";

function mdToHtml(md){
  return md.split('\n').map(line=>{
    if(line.startsWith('## ')) return '<div class="section-title" style="margin-top:22px;font-size:15px;color:var(--gold);">'+line.slice(3)+'</div>';
    if(line.startsWith('# ')) return '<h2 style="margin:6px 0 10px;">'+line.slice(2)+'</h2>';
    if(line.trim()==='') return '<div style="height:6px;"></div>';
    let l = line.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code style="background:var(--card2);padding:2px 5px;border-radius:5px;">$1</code>');
    return '<div style="font-size:13.5px;line-height:1.8;color:var(--text);margin-bottom:2px;">'+l+'</div>';
  }).join('');
}

/* ================= BOOTSTRAP ================= */
const APP_BUILD = 'SOLIX_FINANCE_BUILD_11';
console.log(APP_BUILD);

function cleanStr(s){ return (s||'').replace(/[^\x20-\x7E]/g, '').trim().replace(/\/+$/,''); }

async function boot(){
  if(!cfg || !cfg.url || !cfg.anonKey){ renderConnectScreen(); return; }
  // Self-heal: strip any invisible/non-ASCII characters that may have been
  // saved before this fix existed (smart quotes, zero-width spaces, etc.)
  const cleanUrl = cleanStr(cfg.url);
  const cleanKey = cleanStr(cfg.anonKey);
  if(cleanUrl !== cfg.url || cleanKey !== cfg.anonKey){
    cfg = {url: cleanUrl, anonKey: cleanKey};
    localStorage.setItem(LS_CFG, JSON.stringify(cfg));
    console.log('SOLIX: cleaned corrupted config values');
  }
  if(!/^https:\/\/[a-z0-9]+\.supabase\.co$/i.test(cfg.url) || cfg.anonKey.length < 20){
    localStorage.removeItem(LS_CFG);
    cfg = null;
    renderConnectScreen();
    return;
  }
  try{
    supa = window.supabase.createClient(cfg.url, cfg.anonKey);
    const { data:{ session } } = await supa.auth.getSession();
    S.session = session;
    if(!session){ renderLoginScreen(); return; }
    await loadAll();
    render();
  }catch(e){
    console.error('SOLIX boot error:', e);
    localStorage.removeItem(LS_CFG);
    cfg = null;
    renderConnectScreen();
  }
}

/* ================= DATA LOADING ================= */
async function loadAll(){
  const [settings, balances, products, sales, debtPayments, usdPurchases, transfers, expenses, withdrawals, balanceSales, balanceSalePayments] = await Promise.all([
    supa.from('settings').select('*').single(),
    supa.from('balances').select('*').single(),
    supa.from('products').select('*').order('created_at',{ascending:false}),
    supa.from('sales').select('*').eq('deleted', false).order('sale_date',{ascending:false}).order('created_at',{ascending:false}),
    supa.from('debt_payments').select('*').eq('deleted', false).order('created_at',{ascending:false}),
    supa.from('usd_purchases').select('*').eq('deleted', false).order('purchase_date',{ascending:false}),
    supa.from('transfers').select('*').order('transfer_date',{ascending:false}),
    supa.from('expenses').select('*').eq('deleted', false).order('expense_date',{ascending:false}),
    supa.from('personal_withdrawals').select('*').eq('deleted', false).order('withdrawal_date',{ascending:false}),
    supa.from('balance_sales').select('*').eq('deleted', false).order('sale_date',{ascending:false}).order('created_at',{ascending:false}),
    supa.from('balance_sale_payments').select('*').eq('deleted', false).order('created_at',{ascending:false}),
  ]);
  S.settings = settings.data;
  S.balances = balances.data;
  S.products = products.data || [];
  S.sales = sales.data || [];
  S.debtPayments = debtPayments.data || [];
  S.usdPurchases = usdPurchases.data || [];
  S.transfers = transfers.data || [];
  S.expenses = expenses.data || [];
  S.withdrawals = withdrawals.data || [];
  S.balanceSales = balanceSales.data || [];
  S.balanceSalePayments = balanceSalePayments.data || [];
  S.loading = false;

  // Surface any per-query errors into the in-app debug log (queries don't throw,
  // they just return {data:null, error:{...}} — this is easy to miss silently).
  const checks = [
    ['settings', settings], ['balances', balances], ['products', products], ['sales', sales],
    ['debt_payments', debtPayments], ['usd_purchases', usdPurchases], ['transfers', transfers],
    ['expenses', expenses], ['personal_withdrawals', withdrawals],
    ['balance_sales', balanceSales], ['balance_sale_payments', balanceSalePayments],
  ];
  checks.forEach(([name, result]) => {
    if(result && result.error){
      debugLog('error', 'فشل تحميل جدول ' + name + ': ' + result.error.message + (result.error.code? ' (code: '+result.error.code+')' : ''));
    }
  });
}
async function refresh(){ await loadAll(); render(); }

/* ================= COMPUTED FINANCIALS ================= */
function usdBalance(){
  const cap = S.settings?.initial_capital_usd || 0;
  const purchased = S.usdPurchases.reduce((a,p)=>a+Number(p.amount_usd),0);
  const outflow = S.sales.reduce((a,s)=> s.cost_currency==='LYD' ? a : a+Number(s.cost_usd||0)*Number(s.quantity),0);
  return cap + purchased - outflow;
}
function avgUsdCost(){
  const totalUsd = S.usdPurchases.reduce((a,p)=>a+Number(p.amount_usd),0);
  if(totalUsd<=0) return null;
  const totalLyd = S.usdPurchases.reduce((a,p)=>a+Number(p.amount_usd)*Number(p.rate),0);
  return totalLyd/totalUsd;
}
function lydTotal(){ return (S.balances?.cash||0)+(S.balances?.bank||0)+(S.balances?.phone||0); }
function salesInRange(from){ return S.sales.filter(s=> from? s.sale_date>=from : true); }
function profitSum(list){ return list.reduce((a,s)=>a+Number(s.profit_lyd),0); }
function costSum(list){ return list.reduce((a,s)=>a+Number(s.cost_lyd),0); }
function margin(list){ const c=costSum(list); const p=profitSum(list); return c>0? (p/c*100):0; }
function dateNDaysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().slice(0,10); }
function startOfMonth(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-01'; }
function totalDebtRemaining(){ return S.sales.filter(s=>s.remaining_amount>0).reduce((a,s)=>a+Number(s.remaining_amount),0); }
function debtorsList(){
  const map = {};
  S.sales.filter(s=>s.remaining_amount>0).forEach(s=>{
    const key = s.customer_name || 'بدون اسم';
    if(!map[key]) map[key] = {name:key, phone:s.customer_phone, total:0, sales:[]};
    map[key].total += Number(s.remaining_amount);
    map[key].sales.push(s);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}
function totalStoreExpenses(){ return S.expenses.reduce((a,e)=>a+Number(e.amount),0); }
function totalWithdrawals(){ return S.withdrawals.reduce((a,w)=>a+Number(w.amount),0); }
function totalBalanceSaleCommission(){ return S.balanceSales.reduce((a,b)=>a+(Number(b.amount_phone)-Number(b.amount_received)),0); }
function totalBalanceSaleRemaining(){ return S.balanceSales.filter(b=>b.remaining_amount>0).reduce((a,b)=>a+Number(b.remaining_amount),0); }
function balanceSaleAgentsList(){
  const map = {};
  S.balanceSales.filter(b=>b.remaining_amount>0).forEach(b=>{
    const key = b.agent_name || 'بدون اسم';
    if(!map[key]) map[key] = {name:key, phone:b.agent_phone, total:0, items:[]};
    map[key].total += Number(b.remaining_amount);
    map[key].items.push(b);
  });
  return Object.values(map).sort((a,b)=>b.total-a.total);
}

function renderSaleStepCategory(){

  const activeProducts = S.products.filter(p=>p.active);

    .map(c=>({ name:c.name, count: activeProducts.filter(p=>(p.category&&p.category.trim()?p.category.trim():UNCATEGORIZED)===c.name).length }))
    .filter(c=>c.count>0);
  if(catList.length===0){
    stepEl.innerHTML = `<div class="empty">أضف منتجًا واحدًا على الأقل من قسم المنتجات قبل تسجيل عملية بيع.</div><button class="primary" id="go-prod2">الانتقال إلى المنتجات</button>`;
    document.getElementById('go-prod2').onclick = ()=>{ closeModal(); goToView('products'); };
    return;
  }
  stepEl.innerHTML = `<div class="card">` + catList.map(c=>`
    <div class="list-item tap" data-cat="${encodeURIComponent(c.name)}">
      <div class="l"><div class="name">${c.name===UNCATEGORIZED?'بدون تصنيف':c.name}</div><div class="meta">${c.count} منتج</div></div>
      <div class="amt">${ICONS.chev}</div>
    </div>`).join('') + `</div>`;
  stepEl.querySelectorAll('[data-cat]').forEach(el=> el.onclick = () => renderSaleStepProduct(decodeURIComponent(el.dataset.cat)));
}

function renderSaleStepForm(existing, productId, fromCategory){
  const stepEl = document.getElementById('sale-step');
  const product = S.products.find(p=>p.id===productId);
  const currency = existing? (existing.cost_currency||'USD') : (product? (product.cost_currency||'USD') : 'USD');
  const isLyd = currency==='LYD';
  const costUsd = existing? existing.cost_usd : (product? product.cost_usd : 0);
  const costLydDirect = existing? existing.cost_lyd_direct : (product? product.cost_lyd : 0);
  const productName = existing? existing.product_name : (product? product.name : '');
  const rate = existing? Number(existing.exchange_rate||0) : (avgUsdCost() || Number(S.settings?.current_exchange_rate) || 0);
  const rateSource = existing? 'مثبّت وقت العملية — لا يتغيّر' : (avgUsdCost()? 'متوسط تكلفة الدولار الحالي' : 'سعر افتراضي (لا توجد مشتريات دولار مسجلة بعد)');
  const backIcon = ICONS.chev.replace('stroke-width="2"','stroke-width="2" style="transform:scaleX(-1);display:inline-block;vertical-align:middle;"');
  const unitCostDisplay = isLyd? fmtLYD(costLydDirect) : fmtUSD(costUsd);
  const initialCost = isLyd? Number(costLydDirect||0)*Number(existing?existing.quantity:1) : Number(costUsd||0)*Number(existing?existing.quantity:1)*rate;

  stepEl.innerHTML = `
    ${existing?'':`<div class="list-item tap" id="sale-prod-back" style="padding-bottom:14px;">
      <div class="l"><div class="name" style="color:var(--gold);">${backIcon} رجوع للمنتجات</div></div>
    </div>`}
    <div class="card" style="margin-bottom:14px;">
      <div class="label">المنتج</div>
      <div style="font-weight:700;font-size:16px;">${productName}</div>
      <div class="sub-row"><span>التكلفة للوحدة${isLyd?' (بالدينار)':' (بالدولار)'}</span>
        <span>${unitCostDisplay}${product?` <button type="button" id="f-edit-price" style="background:none;border:none;color:var(--gold);font-size:12px;cursor:pointer;padding:0 0 0 8px;text-decoration:underline;">تعديل السعر</button>`:''}</span>
      </div>
    </div>
    <label class="field">الكمية</label>
    <div class="qty-stepper">
      <button type="button" id="qty-minus">−</button>
      <input id="f-qty" type="number" min="1" step="1" value="${existing?existing.quantity:1}">
      <button type="button" id="qty-plus">+</button>
    </div>
    <div class="card" style="margin-bottom:14px;">
      ${isLyd?`
      <div class="help" style="margin-top:0;">تكلفة هذا المنتج بالدينار مباشرة — بلا سعر صرف.</div>
      `:`
      <div class="sub-row" style="margin-top:0;"><span>سعر الصرف (للتكلفة)</span><span>${rate.toFixed(2)} د.ل</span></div>
      <div class="help" style="margin-top:2px;">${rateSource}</div>
      `}
      <div class="sub-row"><span>التكلفة الإجمالية</span><span id="f-cost-preview">${fmtLYD(initialCost)}</span></div>
    </div>
    <label class="field">سعر البيع (د.ل) — للوحدة</label>
    <input id="f-price" type="number" step="0.01" value="${existing?existing.selling_price_lyd:''}">
    <label class="field">حالة الدفع</label>
    <div class="seg" id="f-status">
      <button data-v="paid" class="${(!existing||existing.payment_status==='paid')?'active':''}">مدفوع</button>
      <button data-v="partial" class="${existing&&existing.payment_status==='partial'?'active':''}">جزئي</button>
      <button data-v="debt" class="${existing&&existing.payment_status==='debt'?'active':''}">دين</button>
    </div>
    <div id="f-account-wrap">
      <label class="field">استلم المبلغ في</label>
      <select id="f-account">
        <option value="cash" ${existing&&existing.payment_account==='cash'?'selected':''}>كاش</option>
        <option value="bank" ${existing&&existing.payment_account==='bank'?'selected':''}>بنك</option>
        <option value="phone" ${existing&&existing.payment_account==='phone'?'selected':''}>رصيد هاتف</option>
      </select>
    </div>
    <div id="f-paid-wrap" class="hide">
      <label class="field">المبلغ المدفوع الآن (د.ل)</label>
      <input id="f-paid" type="number" step="0.01" value="${existing&&existing.payment_status==='partial'?existing.paid_amount:''}">
    </div>
    <div id="f-customer-wrap" class="hide">
      <label class="field">اسم العميل</label>
      <input id="f-cname" value="${existing?existing.customer_name||'':''}">

  `;

  if(!existing){
    document.getElementById('sale-prod-back').onclick = () => renderSaleStepProduct(fromCategory || (product&&product.category? product.category : UNCATEGORIZED));
  }

  if(product){
    document.getElementById('f-edit-price').onclick = () => {
      openModal('تعديل سعر المنتج', `
        <div class="help">هذا يعدّل سعر المنتج في قسم المنتجات لكل المبيعات القادمة — ما يأثرش على عمليات بيع سابقة.</div>
        <label class="field">${productName} — السعر الجديد ${isLyd?'بالدينار':'بالدولار'}</label>
        <input id="pe-cost" type="number" step="0.01" value="${isLyd?product.cost_lyd:product.cost_usd}">
        <button class="primary" id="pe-save">حفظ</button>
      `, ()=>{
        document.getElementById('pe-save').onclick = async () => {
          const newCost = Number(document.getElementById('pe-cost').value);
          if(!newCost || newCost<0){ modalErr('أدخل سعر صحيح.'); return; }
          const field = isLyd? 'cost_lyd' : 'cost_usd';
          const { error } = await supa.from('products').update({[field]:newCost, updated_at:new Date().toISOString()}).eq('id', product.id);
          if(error){ modalErr(error.message); return; }
          if(isLyd) product.cost_lyd = newCost; else product.cost_usd = newCost;
          closeModal();
          renderSaleStepForm(existing, productId, fromCategory);
        };
      });
    };
  }

  const updateCostPreview = () => {
    const qty = Number(document.getElementById('f-qty').value || 0);
    const cost = isLyd ? Number(costLydDirect||0)*qty : Number(costUsd||0)*qty*rate;
    document.getElementById('f-cost-preview').textContent = fmtLYD(cost);
  };
  document.getElementById('f-qty').oninput = updateCostPreview;
  document.getElementById('qty-minus').onclick = () => {
    const inp = document.getElementById('f-qty');
    inp.value = Math.max(1, Number(inp.value||1) - 1);
    updateCostPreview();
  };
  document.getElementById('qty-plus').onclick = () => {
    const inp = document.getElementById('f-qty');
    inp.value = Number(inp.value||1) + 1;
    updateCostPreview();
  };

  let status = existing? existing.payment_status : 'paid';
  const updateVis = ()=>{
    document.getElementById('f-account-wrap').classList.toggle('hide', status==='debt');
    document.getElementById('f-paid-wrap').classList.toggle('hide', status!=='partial');
    document.getElementById('f-customer-wrap').classList.toggle('hide', status==='paid');
  };
  updateVis();
  stepEl.querySelectorAll('#f-status button').forEach(b=>{
    b.onclick = ()=>{ status=b.dataset.v; stepEl.querySelectorAll('#f-status button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); updateVis(); };
  });

  document.getElementById('f-save').onclick = async () => {
    const qty = Number(document.getElementById('f-qty').value);
    const price = Number(document.getElementById('f-price').value);
    const account = status==='debt'? null : document.getElementById('f-account').value;
    const total = price*qty;
    let paid = status==='paid'? total : status==='partial'? Number(document.getElementById('f-paid').value||0) : 0;
    const cname = document.getElementById('f-cname').value.trim() || null;
    const cphone = document.getElementById('f-cphone').value.trim() || null;
    const notes = document.getElementById('f-notes').value.trim() || null;
    const date = document.getElementById('f-date').value;
    if(!qty || !price || (!isLyd && !rate)){ modalErr('يرجى تعبئة جميع الحقول المطلوبة.'); return; }
    if(status==='partial' && (paid<=0 || paid>=total)){ modalErr('المبلغ الجزئي لازم يكون بين 0 و'+total+'.'); return; }
    if(status!=='paid' && !cname){ modalErr('اسم العميل مطلوب للدين أو الدفع الجزئي.'); return; }
    try{
      if(existing){
        const { error } = await supa.rpc('fn_edit_sale', {
          p_sale_id: existing.id, p_quantity: qty, p_exchange_rate: rate, p_selling_price_lyd: price,
          p_payment_status: status, p_payment_account: account, p_customer_name: cname, p_customer_phone: cphone,
          p_notes: notes, p_paid_amount: paid, p_sale_date: date
        });
        if(error) throw error;
      } else {
        const { error } = await supa.rpc('fn_add_sale', {
          p_product_id: productId, p_quantity: qty, p_exchange_rate: rate, p_selling_price_lyd: price,
          p_payment_status: status, p_payment_account: account, p_customer_name: cname, p_customer_phone: cphone,
          p_notes: notes, p_paid_amount: paid, p_sale_date: date
        });
        if(error) throw error;
      }
      closeModal(); await refresh();
    }catch(e){ modalErr(e.message); }
  };
  if(existing){
    document.getElementById('f-delete').onclick = async () => {
      if(!confirm('تأكيد حذف عملية البيع؟')) return;
      const { error } = await supa.rpc('fn_delete_sale', {p_sale_id: existing.id});
      if(error){ modalErr(error.message); return; }
      closeModal(); await refresh();
    };
  }
}

/* ================= PRODUCTS ================= */
const UNCATEGORIZED = '__بدون_تصنيف__';

function categoryOrderList(){ return (S.settings && S.settings.category_order) ? S.settings.category_order : []; }

function productCategories(){
  const map = {};
  S.products.forEach(p=>{
    const key = (p.category && p.category.trim()) ? p.category.trim() : UNCATEGORIZED;
    if(!map[key]) map[key] = {name:key, total:0, active:0};
    map[key].total++;
    if(p.active) map[key].active++;
  });
  const order = categoryOrderList();
  const list = Object.values(map);
  list.sort((a,b)=>{
    if(a.name===UNCATEGORIZED) return 1;
    if(b.name===UNCATEGORIZED) return -1;
    const ia = order.indexOf(a.name), ib = order.indexOf(b.name);
    if(ia===-1 && ib===-1) return a.name.localeCompare(b.name,'ar');
    if(ia===-1) return 1;
    if(ib===-1) return -1;
    return ia-ib;
  });
  return list;
}

async function moveCategory(name, dir){
  const cats = productCategories().filter(c=>c.name!==UNCATEGORIZED).map(c=>c.name);
  const i = cats.indexOf(name);
  const j = i + dir;
  if(i<0 || j<0 || j>=cats.length) return;
  [cats[i], cats[j]] = [cats[j], cats[i]];
  const { error } = await supa.from('settings').update({category_order: cats, updated_at: new Date().toISOString()}).eq('id', true);
  if(error){ debugLog('error', 'فشل حفظ ترتيب الأصناف: '+error.message); return; }
  S.settings.category_order = cats;
  viewProducts();
}

async function moveProduct(id, dir){
  const filterVal = S.productCategoryFilter;
  const items = S.products
    .filter(p => (p.category && p.category.trim() ? p.category.trim() : UNCATEGORIZED) === filterVal)
    .sort((a,b)=> (a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name,'ar'));
  const i = items.findIndex(p=>p.id===id);
  const j = i + dir;
  if(i<0 || j<0 || j>=items.length) return;
  const a = items[i], b = items[j];
  const aOrder = a.sort_order||0, bOrder = b.sort_order||0;
  const newAOrder = bOrder, newBOrder = aOrder===bOrder? aOrder+1 : aOrder;
  const { error: e1 } = await supa.from('products').update({sort_order:newAOrder}).eq('id', a.id);
  const { error: e2 } = await supa.from('products').update({sort_order:newBOrder}).eq('id', b.id);
  if(e1||e2){ debugLog('error', 'فشل حفظ ترتيب المنتجات: '+((e1||e2).message)); return; }
  a.sort_order = newAOrder; b.sort_order = newBOrder;
  viewProducts();
}

function viewProducts(){
  const c = document.getElementById('content');
  if(S.products.length===0){
    c.innerHTML = `<div class="empty">لا توجد منتجات بعد.<br>اضغط + لإضافة منتج.</div>`;
    showFab(()=> openProductForm());
    return;
  }
  if(!S.productCategoryFilter){
    // Level 1: category folders
    const cats = productCategories();
    const realCats = cats.filter(c=>c.name!==UNCATEGORIZED);
    c.innerHTML = `<div class="card">` + cats.map(cat=>{
      const idx = realCats.findIndex(x=>x.name===cat.name);
      const canReorder = cat.name!==UNCATEGORIZED;
      return `
      <div class="list-item" data-cat="${encodeURIComponent(cat.name)}">
        ${canReorder?`<div style="display:flex;flex-direction:column;gap:2px;margin-left:6px;">
          <button class="reorder-btn" data-cat-up="${encodeURIComponent(cat.name)}" ${idx<=0?'disabled':''}>▲</button>
          <button class="reorder-btn" data-cat-down="${encodeURIComponent(cat.name)}" ${idx>=realCats.length-1?'disabled':''}>▼</button>
        </div>`:'<div style="width:26px;"></div>'}
        <div class="l tap" data-cat-open="${encodeURIComponent(cat.name)}">
          <div class="name">${cat.name===UNCATEGORIZED?'بدون تصنيف':cat.name}</div>
          <div class="meta">${cat.total} منتج${cat.active<cat.total?' · '+cat.active+' نشط':''}</div>
        </div>
        <div class="amt tap" data-cat-open="${encodeURIComponent(cat.name)}">${ICONS.chev}</div>
      </div>`;}).join('') + `</div>`;
    c.querySelectorAll('[data-cat-open]').forEach(el => el.onclick = () => { S.productCategoryFilter = decodeURIComponent(el.dataset.catOpen); viewProducts(); });
    c.querySelectorAll('[data-cat-up]').forEach(el => el.onclick = (e) => { e.stopPropagation(); moveCategory(decodeURIComponent(el.dataset.catUp), -1); });
    c.querySelectorAll('[data-cat-down]').forEach(el => el.onclick = (e) => { e.stopPropagation(); moveCategory(decodeURIComponent(el.dataset.catDown), 1); });
    showFab(()=> openProductForm());
  } else {
    // Level 2: products within the selected category
    const filterVal = S.productCategoryFilter;
    const items = S.products
      .filter(p => (p.category && p.category.trim() ? p.category.trim() : UNCATEGORIZED) === filterVal)
      .sort((a,b)=> (a.sort_order||0)-(b.sort_order||0) || a.name.localeCompare(b.name,'ar'));
    c.innerHTML = `
      <div class="list-item tap" id="cat-back" style="padding-bottom:14px;">
        <div class="l"><div class="name" style="color:var(--gold);">${ICONS.chev.replace('stroke-width="2"','stroke-width="2" style="transform:scaleX(-1);display:inline-block;vertical-align:middle;"')} كل الأصناف</div></div>
      </div>
      <div class="section-title">${filterVal===UNCATEGORIZED?'بدون تصنيف':filterVal}</div>
      <div class="card">` + items.map((p,idx)=>`
      <div class="list-item" data-id="${p.id}">
        <div style="display:flex;flex-direction:column;gap:2px;margin-left:6px;">
          <button class="reorder-btn" data-up="${p.id}" ${idx<=0?'disabled':''}>▲</button>
          <button class="reorder-btn" data-down="${p.id}" ${idx>=items.length-1?'disabled':''}>▼</button>
        </div>
        <div class="l tap" data-open="${p.id}">
          <div class="name">${p.name} ${!p.active?'<span class="pill debt">غير نشط</span>':''}</div>
          <div class="meta">${p.category||'بدون تصنيف'}</div>
        </div>
        <div class="amt tap" data-open="${p.id}">${fmtCost(p)}</div>
      </div>`).join('') + `</div>`;
    document.getElementById('cat-back').onclick = () => { S.productCategoryFilter = null; viewProducts(); };
    c.querySelectorAll('[data-open]').forEach(el=> el.onclick = () => openProductForm(S.products.find(p=>p.id===el.dataset.open)));
    c.querySelectorAll('[data-up]').forEach(el=> el.onclick = (e) => { e.stopPropagation(); moveProduct(el.dataset.up, -1); });
    c.querySelectorAll('[data-down]').forEach(el=> el.onclick = (e) => { e.stopPropagation(); moveProduct(el.dataset.down, 1); });
    showFab(()=> openProductForm(null, filterVal===UNCATEGORIZED?'':filterVal));
  }
}

      <button data-v="USD" class="${curr==='USD'?'active':''}">بالدولار</button>

    <button class="primary" id="p-save">${existing?'حفظ':'إضافة'}</button>
    ${existing?`<div style="height:8px;"></div><button class="danger" id="p-delete" style="width:100%;">حذف المنتج</button>`:''}
  `, ()=>{
    let currency = curr;

      if(currency==='LYD' && !costLyd){ modalErr('يرجى إدخال التكلفة بالدينار.'); return; }

        if(error){ modalErr(error.message); return; }
      } else {
        const { error } = await supa.from('products').insert({name,category,cost_usd:costUsd,cost_lyd:costLyd,cost_currency:currency,notes});
        if(error){ modalErr(error.message); return; }
      }
      closeModal(); await refresh();
    };
    if(existing){
      document.getElementById('p-delete').onclick = async () => {
        const used = S.sales.some(s=>s.product_id===existing.id);
        if(used){
          if(!confirm('هذا المنتج مرتبط بمبيعات سابقة، ولا يمكن حذفه نهائيًا — سيتم تعيينه "غير نشط" بدلاً من الحذف. هل تريد المتابعة؟')) return;
          await supa.from('products').update({active:false}).eq('id', existing.id);
        } else {
          if(!confirm('تأكيد حذف المنتج نهائيًا؟')) return;
          await supa.from('products').delete().eq('id', existing.id);
        }
        closeModal(); await refresh();
      };
    }
  });
}

    </div>
    <div id="bs-agent-wrap" class="hide">

    </div>

    <input id="bs-date" type="date" value="${todayISO()}">

    <textarea id="bs-notes" rows="2"></textarea>
    <button class="primary" id="bs-save">تسجيل العملية</button>
  `, ()=>{
    let status = 'paid';
    const updateVis = () => {
      document.getElementById('bs-paid-wrap').classList.toggle('hide', status!=='partial');
      document.getElementById('bs-agent-wrap').classList.toggle('hide', status==='paid');
    };
    const updateCommission = () => {
      const phone = Number(document.getElementById('bs-phone').value||0);
      const received = Number(document.getElementById('bs-received').value||0);
      document.getElementById('bs-commission').textContent = fmtLYD(phone-received);
    };
    document.getElementById('bs-phone').oninput = updateCommission;
    document.getElementById('bs-received').oninput = updateCommission;
    document.querySelectorAll('#bs-status button').forEach(b=>{
      b.onclick = () => { status=b.dataset.v; document.querySelectorAll('#bs-status button').forEach(x=>x.classList.remove('active')); b.classList.add('active'); updateVis(); };
    });
    updateVis();
    document.getElementById('bs-save').onclick = async () => {
      const phone = Number(document.getElementById('bs-phone').value);

      closeModal(); await refresh();

  });

    document.getElementById('e-save').onclick = async () => {
      const amt = Number(document.getElementById('e-amt').value);
      const acc = document.getElementById('e-acc').value;
      const cat = document.getElementById('e-cat').value.trim() || null;
      const date = document.getElementById('e-date').value;
      const notes = document.getElementById('e-notes').value.trim() || null;
      if(!amt || amt<=0){ modalErr('دخّل مبلغ صحيح.'); return; }
      if(S.balances[acc] < amt){ modalErr('الرصيد غير كافي.'); return; }
      const { error } = await supa.rpc('fn_add_expense', {p_amount:amt, p_account:acc, p_category:cat, p_expense_date:date, p_note:notes});
      if(error){ modalErr(error.message); return; }
      closeModal(); await refresh();
    };
  });
}

/* ================= LEDGER ================= */
function viewLedger(){
  const c = document.getElementById('content');
  const items = [
    ...S.sales.map(s=>({date:s.sale_date, type:'بيع', name:s.product_name, amount:s.total_sales_lyd, account:s.payment_account, status:s.payment_status, sign:1, color:''})),
    ...S.debtPayments.map(p=>({date:p.payment_date, type:'تسديد دين', name:'', amount:p.amount, account:p.account, status:'paid', sign:1, color:'green'})),
    ...S.usdPurchases.map(p=>({date:p.purchase_date, type:'شراء دولار', name:fmtUSD(p.amount_usd), amount:p.total_paid_lyd, account:p.source_account, status:'', sign:-1, color:''})),
    ...S.transfers.map(t=>({date:t.transfer_date, type:'تحويل', name:ACCOUNTS[t.from_account]+' ← '+ACCOUNTS[t.to_account], amount:t.amount, account:'', status:'', sign:0, color:''})),
    ...S.expenses.map(e=>({date:e.expense_date, type:'مصروف', name:e.category||'', amount:e.amount, account:e.account, status:'', sign:-1, color:'orange'})),
    ...S.withdrawals.map(w=>({date:w.withdrawal_date, type:'سحب شخصي', name:'', amount:w.amount, account:w.source_account, status:'', sign:-1, color:''})),
    ...S.balanceSales.map(b=>({date:b.sale_date, type:'بيع رصيد', name:b.agent_name||'', amount:b.paid_amount, account:b.destination_account, status:b.payment_status, sign:1, color:'green'})),
    ...S.balanceSalePayments.map(p=>({date:p.payment_date, type:'تسديد بيع رصيد', name:'', amount:p.amount, account:p.account, status:'paid', sign:1, color:'green'})),
  ].sort((a,b)=> b.date.localeCompare(a.date));

  if(items.length===0){ c.innerHTML = `<div class="empty">لا توجد عمليات بعد.</div>`; return; }
  c.innerHTML = `<div class="card">` + items.map(i=>`
    <div class="list-item">

        <div class="meta">${i.date}${i.account?' · '+ACCOUNTS[i.account]:''}</div></div>
      <div class="amt ${i.color}">${i.sign>0?'+':i.sign<0?'-':''}${fmtLYD(i.amount)}</div>
    </div>`).join('') + `</div>`;
}

  }

    <div class="section-title">سعر الصرف الاحتياطي</div>
    <div class="card">
      <div class="help">تكلفة المبيعات تُحسب تلقائيًا من متوسط تكلفة الدولار الفعلي (من صفحة الدولار). هذا السعر يُستخدم فقط كبديل مؤقت قبل أي عملية شراء دولار مسجلة.</div>

      <button class="secondary" id="s-changepass">تغيير كلمة مرور الحساب</button>
      <div style="height:10px;"></div>
      <button class="danger" id="s-signout" style="width:100%;">تسجيل الخروج</button>
    </div>

    <div class="section-title">مساعدة</div>
    <div class="card"><button class="secondary" id="s-guide">دليل الإعداد الكامل + SQL</button></div>

    <div class="section-title">سجل التعديلات (Audit Log)</div>
    <div class="card"><button class="secondary" id="s-audit">عرض آخر التعديلات</button></div>
  `;
  document.getElementById('s-rate-save').onclick = async () => {
    const v = Number(document.getElementById('s-rate').value);
    if(!v||v<=0) return;
    await supa.from('settings').update({current_exchange_rate:v, updated_at:new Date().toISOString()}).eq('id', true);
    await refresh();
  };
  document.getElementById('s-cap-save').onclick = async () => {
    const v = Number(document.getElementById('s-cap').value);
    await supa.from('settings').update({initial_capital_usd:v, updated_at:new Date().toISOString()}).eq('id', true);
    await refresh();
  };
  document.getElementById('s-bal-save').onclick = async () => {
    const cash = Number(document.getElementById('s-cash').value)||0;
    const bank = Number(document.getElementById('s-bank').value)||0;
    const phone = Number(document.getElementById('s-phone').value)||0;
    await supa.from('balances').update({cash,bank,phone,updated_at:new Date().toISOString()}).eq('id', true);

}
/* ================= IN-APP DEBUG PANEL ================= */
/* Shows a visible, screenshot-friendly log of errors — no browser dev tools needed. */
let DEBUG_LOG = [];
function debugLog(kind, msg){
  DEBUG_LOG.push({kind, msg: String(msg), time: new Date().toLocaleTimeString('ar')});
  if(DEBUG_LOG.length > 30) DEBUG_LOG.shift();
  renderDebugBadge();
}
window.addEventListener('error', (e) => debugLog('error', (e.message||'خطأ غير معروف') + (e.filename? ' — '+e.filename+':'+e.lineno : '')));
window.addEventListener('unhandledrejection', (e) => debugLog('error', 'Promise error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)));
const _origConsoleError = console.error.bind(console);
console.error = (...args) => { debugLog('error', args.map(a=> a && a.message ? a.message : String(a)).join(' ')); _origConsoleError(...args); };

function renderDebugBadge(){
  let badge = document.getElementById('debug-badge');
  const errCount = DEBUG_LOG.filter(l=>l.kind==='error').length;
  if(!badge){
    badge = document.createElement('button');
    badge.id = 'debug-badge';
    badge.style.cssText = 'position:fixed;bottom:78px;left:12px;z-index:9999;width:38px;height:38px;border-radius:50%;border:2px solid var(--border);background:var(--card2);color:var(--sub);font-size:11px;font-weight:800;cursor:pointer;box-shadow:0 4px 12px rgba(0,0,0,.4);';
    badge.onclick = openDebugPanel;
    document.body.appendChild(badge);
  }
  if(errCount > 0){
    badge.textContent = errCount;
    badge.style.borderColor = 'var(--red)';
    badge.style.color = 'var(--red)';
  } else {
    badge.textContent = '⚙';
    badge.style.borderColor = 'var(--border)';
    badge.style.color = 'var(--sub)';
  }
}

function openDebugPanel(){
  const wrap = document.createElement('div');
  wrap.className = 'modal-overlay';
  wrap.id = 'debug-wrap';
  const rows = DEBUG_LOG.length ? DEBUG_LOG.slice().reverse().map(l => `
    <div style="padding:10px;border-radius:8px;margin-bottom:8px;background:${l.kind==='error'?'rgba(217,83,79,.12)':'var(--card2)'};">
      <div style="font-size:10px;color:var(--sub);margin-bottom:3px;">${l.time}</div>
      <div style="font-size:12.5px;color:${l.kind==='error'?'var(--red)':'var(--text)'};word-break:break-word;font-family:monospace;">${l.msg.replace(/</g,'&lt;')}</div>
    </div>`).join('') : '<div class="empty">لا توجد رسائل بعد.</div>';
  wrap.innerHTML = `<div class="modal">
    <div class="modal-head"><h2>سجل الأخطاء (${APP_BUILD})</h2><button id="debug-close">${ICONS.close}</button></div>
    <div style="margin-bottom:12px;font-size:12px;color:var(--sub);">هذي رسائل تقنية لتشخيص المشاكل — صوّر هذي الشاشة وابعتها عند الحاجة.</div>
    ${rows}
    <div style="height:8px;"></div>
    <button class="secondary" id="debug-clear">مسح السجل</button>
  </div>`;
  document.body.appendChild(wrap);
  wrap.querySelector('#debug-close').onclick = () => wrap.remove();
  wrap.onclick = (e)=>{ if(e.target===wrap) wrap.remove(); };
  wrap.querySelector('#debug-clear').onclick = () => { DEBUG_LOG = []; renderDebugBadge(); wrap.remove(); };
}

boot();
renderDebugBadge();
debugLog('info', 'التطبيق بدأ التشغيل — ' + APP_BUILD);
</script>
